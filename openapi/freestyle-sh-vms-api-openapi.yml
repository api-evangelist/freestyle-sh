  /vms/{vmIdOrSlug}:
    get:
      tags:
      - VMs
      description: Fetch a VM by its id or its slug.
      operationId: getVmsByVmIdOrSlug
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The VM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
