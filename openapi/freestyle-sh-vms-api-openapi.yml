openapi: 3.2.0
info:
  title: Freestyle VMs API
  description: '# Powerful Virtual Machines


    Documentation: freestyle.sh/docs


    Freestyle VMs are full Linux virtual machines designed for long running, complex tasks. ## Key Features


    - **Instant Startup**: Freestyle VMs provision in milliseconds, with p99s under 400ms. - **Persistence**: Freestyle VMs can run forever, they can be hibernated with their exact memory in place and come back to life weeks later instantly, in that exact state. - **Powerful**: Freestyle VMs go up to 64GB of RAM for public tiers and much further for enterprise. Freestyle does high quality hardware virtualization supporting nested virtualization, FUSE, eBPF, full Linux networking and more. If it can run in an EC2, it can run in a Freestyle VM. - **Cheaply Snapshottable and Branchable**: Freestyle VMs are instantly and cheaply snapshottable (sub 1ms interruption, sub 50ms to snapshot ready). These snapshots can be used to create new VMs in the exact state of the original VM (memory and disk). This enables powerful workflows like branching, cloning, and rapid recovery from failures. ## When to use Freestyle


    - **Long Running Agent Tasks**: When you have tasks that take hours, days, weeks or months to run, Freestyle VMs provide a persistent and powerful environment that your agent can work in to completion. - **Failure Prone/Experimental Exploration**: When your tasks involve branching, cloning or need time travel Freestyle VMs are ideal because of their cheap snapshottability and power that makes them great for experiments. - **Complex Coding Problems**: When you are tackling advanced coding problems in research or production codebases, poor virtualization and small sandboxes will not cut it. Freestyle VMs provide the necessary resources and environment to handle these challenges effectively. - **Multi Tenant Usage Patterns**: Freestyle VMs are intentionally built to be used by agent builders with multiple customers. The slug system allows for keying VMs by their user, the identity system allows for granular acccess control and permissioning, and the VPC system allows for multi-tenant network isolation. ## When not to use it


    - **"Run AI Code"**: If your exclusively executing short lived Python scripts or other ephemeral tasks the benefits above aren''t relevant. Freestyle VMs should still be benchmarked but there may be alternatives better suited. - **CPU Intensive CI/CD**: Freestyle VMs run on bare metal on data center CPUs. We also oversubscribe host resources. For workloads that require sustained high CPU usage like building the Linux Kernel or mining crypto prefer cloud providers that offer consumer CPU performance. - **Short Lived Tasks**: If your tasks are extremely short lived and do not benefit from persistence or powerful hardware. If your average task takes less than 15 minutes to complete then they are likely cheaply retryable and don''t require the reliability and persistence that Freestyle VMs provide. - **Sole Application Hosting**: Freestyle VMs are designed as workbenches for development, experimentation and task execution. Not for hosting production applications. Hosting a minecraft server for some friends will work great on Freestyle, but we do not offer autoscaling, load balancers or CDNs and we don''t plan to. ## Emerging Use Cases


    - **RL Environments**: Freestyle VMs are well-suited for running reinforcement learning environments that require persistent state and complex setups. The ability to snapshot and branch VMs allows researchers to experiment with different strategies and record environment states efficiently. - **Auto Research Climbing**: Freestyle VMs are great for auto research as the snapshotting and fan out allows research agents to explore multiple strategies, review past results and iterate efficiently without ever losing progress.'
  license:
    name: ''
  version: 0.1.0
security:
- apiKey: []
tags:
- name: VMs
  description: Boot, control, and run commands in your VMs
paths:
  /v5/vms:
    get:
      tags:
      - VMs
      description: List your VMs.
      operationId: list_vms
      parameters:
      - name: state
        in: query
        description: Only VMs in this state.
        required: false
        schema:
          $ref: '#/components/schemas/VmState'
      - name: slug
        in: query
        description: Exact slug match.
        required: false
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: snapshotId
        in: query
        description: Only VMs booted from this snapshot.
        required: false
        schema:
          type: string
      - name: vpc
        in: query
        description: Only VMs attached to this network (id, or your slug for it).
        required: false
        schema:
          type: string
      - name: metadata
        in: query
        description: Comma-separated `key:value` pairs, e.g. `env:prod,region:us-west`.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: The account's VMs, with per-state counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVmsResponse'
        '404':
          description: 'NOT_FOUND: the `vpc` filter names a network that does not exist in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: List vms
      x-summary-source: derived
    post:
      tags:
      - VMs
      description: Boot a new VM.
      operationId: create_vm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVmRequest'
        required: true
      responses:
        '201':
          description: VM created and booting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '400':
          description: 'BAD_REQUEST: invalid slug, metadata, or a snapshot that does not exist'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: that slug is already used by another VM in your account (pass `reassignSlug` to take it), or no capacity is available'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '429':
          description: 'LIMIT_EXCEEDED: your plan''s limit for this resource is reached'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Create vm
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}:
    get:
      tags:
      - VMs
      description: Fetch a VM by its id or its slug.
      operationId: get_vm
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The VM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Get vm
      x-summary-source: derived
    delete:
      tags:
      - VMs
      description: Permanently destroy the VM.
      operationId: delete_vm
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      responses:
        '204':
          description: VM deleted
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Delete vm
      x-summary-source: derived
    patch:
      tags:
      - VMs
      description: Rename a VM, change its slug or idle timeout, or merge in metadata.
      operationId: update_vm
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVmRequest'
        required: true
      responses:
        '200':
          description: The updated VM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '400':
          description: 'BAD_REQUEST: invalid slug or metadata'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: that slug is already used by another VM in your account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Update vm
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/exec-await:
    post:
      tags:
      - VMs
      description: Run a command in the guest and wait for it to finish. A non-zero exit status is still a 200. Read `statusCode`, which is null if the command was killed by its timeout.
      operationId: exec_vm
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
        required: true
      responses:
        '200':
          description: The command finished (a non-zero exit is still a 200)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResponse'
        '400':
          description: 'BAD_REQUEST: invalid timeoutMs (maximum 86400000 when backgrounded, 300000 inline), or stdin over 1 MiB'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '403':
          description: 'FORBIDDEN: the identity access token is not allowed to use this VM or guest Linux user'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: the VM is not running, or it stopped responding mid-command (`VM_NON_RESPONSIVE` — the command may already have run; do not retry blindly)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      security:
      - apiKey: []
      - identityAccessToken: []
      summary: Exec vm
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/networks:
    put:
      tags:
      - VMs
      description: 'Set the VM''s private networks — attach, update, or detach in one declarative call (an empty list detaches). Works while the VM is stopped, running, or paused: a stopped VM picks the change up on its next start, a running VM is reconfigured live, and a paused VM applies it on resume. At most one network is accepted today. The VM keeps its address while it stays in the same network; moving networks (or naming a different address) renumbers it.'
      operationId: update_vm_networks
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVmNetworksRequest'
        required: true
      responses:
        '200':
          description: The updated VM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '400':
          description: 'BAD_REQUEST: more than one network, an address outside the network CIDR, or invalid routes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such VM, or the named network does not exist in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: the VM is starting or pausing, the address is already reserved, or the guest cannot be reconfigured live (shut it down and start it again instead)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Update vm networks
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/pause:
    post:
      tags:
      - VMs
      description: Freeze a running VM, keeping its memory so a later start resumes it exactly.
      operationId: pause_vm
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The paused VM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: the VM is not running'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Pause vm
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/pty:
    get:
      tags:
      - VMs
      description: 'Open an interactive terminal on the VM over a WebSocket. The session outlives this connection: closing the socket only detaches, so it can be reattached or listed later. It also outlives the host that serves it — a host restart reattaches this socket to the same session and replays its scrollback behind a terminal reset, with no break in the stream.'
      operationId: open_pty
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      - name: exec
        in: query
        description: Command to run; omit for a login shell
        required: false
        schema:
          type: string
      - name: cols
        in: query
        description: Initial width in columns (default 80)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: rows
        in: query
        description: Initial height in rows (default 24)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: linuxUser
        in: query
        description: Guest Linux user to run as; omit for the guest's default user (uid 1000, else root)
        required: false
        schema:
          type: string
      - name: slug
        in: query
        description: 'Name this session so you can reattach to it later without storing the id we mint. If a session already has this name you get that one back — alive, or exited with its final output and exit code still readable — and `exec` is NOT run; the `sessionInfo` frame''s `created` says which happened. Starting over is DELETE then open again. Must not be all digits: session ids are bare integers, so an all-digit name could not be told apart from one.'
        required: false
        schema:
          type: string
      - name: replaceOnExit
        in: query
        description: 'Respawn the shell in place when it exits, keeping this session''s id, name and scrollback — for a terminal that should outlive whatever runs in it. A command that dies at startup is not respawned forever; after a few exits in quick succession the session is left dead so the error is readable. Leave this off if you are waiting on a command''s exit code: a session that comes back to life reports `running` again.'
        required: false
        schema:
          type: boolean
      responses:
        '101':
          description: Switching protocols. The first text frame carries `{"type":"sessionInfo","sessionId":N,"slug":"…","created":true}`; after that, binary frames are terminal I/O and text frames are `resize`/`signal` in, `exited`/`error` out.
        '400':
          description: 'BAD_REQUEST: not a WebSocket upgrade request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: the VM stopped responding during the terminal handshake (`VM_NON_RESPONSIVE`); the session may have been created, so list sessions before opening another'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      security:
      - apiKey: []
      - identityAccessToken: []
      summary: Open pty
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/pty/sessions:
    get:
      tags:
      - VMs
      description: List the VM's terminal sessions, running and recently exited. Scoped to one Linux user when the request names one, otherwise every session on the VM.
      operationId: list_pty_sessions
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      - name: linuxUser
        in: query
        description: Only sessions owned by this guest Linux user; omit for all of them
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The VM's terminal sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPtySessionsResponse'
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      security:
      - apiKey: []
      - identityAccessToken: []
      summary: List pty sessions
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/pty/sessions/{sessionId}:
    get:
      tags:
      - VMs
      description: Reattach to an existing terminal session over a WebSocket, addressed by id or by the slug it was opened with. The retained scrollback replays first, then live output follows.
      operationId: attach_pty
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        description: Session id, or the slug the session was opened with
        required: true
        schema:
          type: string
      - name: linuxUser
        in: query
        description: Guest Linux user that must own the session
        required: false
        schema:
          type: string
      responses:
        '101':
          description: Switching protocols. Same frame protocol as opening a terminal, including the initial `sessionInfo` frame — a caller that attached by slug has not seen the id yet.
        '400':
          description: 'BAD_REQUEST: not a WebSocket upgrade request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such VM or session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      security:
      - apiKey: []
      - identityAccessToken: []
      summary: Attach pty
      x-summary-source: derived
    delete:
      tags:
      - VMs
      description: Kill a terminal session and remove it, addressed by id or by the slug it was opened with.
      operationId: close_pty_session
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        description: Session id, or the slug the session was opened with
        required: true
        schema:
          type: string
      - name: linuxUser
        in: query
        description: Guest Linux user that must own the session
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Session killed and removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosePtySessionResponse'
        '404':
          description: 'NOT_FOUND: no such VM or session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      security:
      - apiKey: []
      - identityAccessToken: []
      summary: Close pty session
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/resize:
    post:
      tags:
      - VMs
      description: 'Change a VM''s vCPU, memory, or disk. Resizing is grow-only on every axis: each can go up but never down. Omitted fields keep their current value. vCPU and memory apply live to a running VM, apply on resume for a paused one, and apply at the next boot for a stopped one. Growing the disk needs a running VM, since it grows a live block device and then its filesystem.'
      operationId: resize_vm
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeVmRequest'
        required: true
      responses:
        '200':
          description: The resized VM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '400':
          description: 'BAD_REQUEST: requested size is below the current size on some axis'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: the disk can only grow while the VM is running, or the node is out of capacity'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '429':
          description: 'LIMIT_EXCEEDED: your plan''s limit for this resource is reached'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Resize vm
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/start:
    post:
      tags:
      - VMs
      description: Boot a stopped VM, or resume a paused one.
      operationId: start_vm
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The starting VM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: the VM is ephemeral and was deleted when it shut down, or no capacity is available'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Start vm
      x-summary-source: derived
  /vms:
