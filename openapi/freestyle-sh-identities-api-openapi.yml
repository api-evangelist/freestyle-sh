components:
  schemas:
    UpdateAllowedLinuxUsersBody:
      type: object
      properties:
        allowedLinuxUsers:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The new allowed-Linux-users list; null grants unrestricted access.
    CreateIdentityBody:
      type: object
      properties:
        managed:
          type: boolean
          description: 'Create a managed identity. Managed identities cannot be deleted through

            the public surface.'
    AccountId:
      type: string
      description: 'Identifies an account. New accounts are minted by the identity

        service''s registry as `"acct-<uuid>"`; accounts created before the

        prefix era are bare UUID strings, and the built-in `freestyle`

        infrastructure account is the literal `"freestyle"`. All three forms

        are equally valid ids: the prefix is a minting convention, not a

        format requirement.'
    IdentityTokenId:
      type: string
      description: Identifies an identity access token row. Minted as `"tok-<uuid>"`.
    ListIdentities:
      type: object
      required:
      - identities
      - total
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/FreestyleIdentity'
        total:
          type: integer
          format: int64
          minimum: 0
    CreatedToken:
      type: object
      required:
      - id
      - token
      properties:
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        id:
          $ref: '#/components/schemas/IdentityTokenId'
        token:
          type: string
    VmPermission:
      type: object
      required:
      - id
      - identityId
      - vmId
      - grantedAt
      - grantedBy
      properties:
        allowedLinuxUsers:
          type:
          - array
          - 'null'
          items:
            type: string
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          $ref: '#/components/schemas/AccountId'
        id:
          $ref: '#/components/schemas/VmPermissionId'
        identityId:
          $ref: '#/components/schemas/IdentityId'
        vmId:
          $ref: '#/components/schemas/VmId'
    VmPermissionId:
      type: string
      description: Identifies a VM-permission grant row. Minted as `"vmp-<uuid>"`.
    PublicErrorBody:
      type: object
      description: 'The shape of every error response: a stable machine-readable `code` and a

        human-readable `message`. The HTTP status carries the class of failure.


        Some errors add fields alongside these two; `code` and `message` are always

        present.'
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'A stable identifier for the failure, in `SCREAMING_SNAKE_CASE`. Branch

            on this; `message` is prose and may be reworded at any time.'
          example: NOT_FOUND
        message:
          type: string
          description: 'A human-readable explanation of what went wrong. A fault inside the

            platform is always reported as `INTERNAL_ERROR` with no further detail.'
          example: vm vm-1234 not found
    GrantVmPermissionBody:
      type: object
      required:
      - vmId
      properties:
        allowedLinuxUsers:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Restrict the grant to these Linux users; omit (or null) for

            unrestricted access.'
        vmId:
          $ref: '#/components/schemas/VmId'
    CreateAccessTokenOptions:
      type: object
      properties:
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: RFC 3339 deadline; omitted or null means the token never expires.
    AccessTokenInfo:
      type: object
      required:
      - id
      properties:
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        id:
          $ref: '#/components/schemas/IdentityTokenId'
    FreestyleIdentityInfo:
      type: object
      required:
      - id
      - accountId
      - managed
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId'
        id:
          $ref: '#/components/schemas/IdentityId'
        managed:
          type: boolean
    VmId:
      type: string
      description: Identifies a VM. Minted as `"vm-<uuid>"`.
    IdentityId:
      type: string
      description: 'Identifies an identity (the auth principal under an account). Minted

        as `"idn-<uuid>"`.'
    FreestyleIdentity:
      type: object
      required:
      - id
      - managed
      properties:
        id:
          $ref: '#/components/schemas/IdentityId'
        managed:
          type: boolean
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'Your Freestyle API key, sent as `Authorization: Bearer <api key>`. Every request needs one unless it is authenticated with an identity access token instead.'
    identityAccessToken:
      type: apiKey
      in: header
      name: x-freestyle-identity-access-token
      description: An access token belonging to an identity you created. It reaches only the VMs that identity has been granted, and only their exec and terminal routes. Hand one to an end user instead of your API key.
