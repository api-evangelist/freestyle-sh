          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such rule in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Update tls rule
      x-summary-source: derived
    delete:
      tags:
      - TLS
      description: Delete a TLS rule. The resources it named are untouched — the dependency runs one way.
      operationId: delete_tls_rule
      parameters:
      - name: ruleId
        in: path
        description: TLS rule id
        required: true
        schema:
