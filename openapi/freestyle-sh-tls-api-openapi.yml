components:
  schemas:
    RemoveOperation:
      type: object
      description: JSON Patch 'remove' operation representation
      required:
      - path
      properties:
        path:
          type: string
          description: 'JSON-Pointer value [RFC6901](https://tools.ietf.org/html/rfc6901) that references a location

            within the target document where the operation is performed.'
    TlsEndpoint:
      type: object
      description: 'One end of a rule: which session this side matches.


        A `source` says *who* may open the session (`vmId`/`vpcId`/`public: true`); a

        `destination` says *where it lands* (`vmId`+`port`, `host`+`port`, or

        `public: true` for the domain''s own origin). Unknown fields are rejected

        rather than ignored: a rule is a security statement, and a typo that quietly

        widened it is the wrong failure.'
      properties:
        host:
          type:
          - string
          - 'null'
          description: '**Destination only.** Pin the session to this host instead of resolving

            the domain, while still presenting `domain` as the SNI.'
        port:
          type:
          - integer
          - 'null'
          format: int32
          description: '**Destination only.** The port the session lands on. Required with a

            `vmId` or `host` destination; defaults to 443 for a `public` origin.'
          minimum: 0
        public:
          type:
          - boolean
          - 'null'
          description: 'On a source, every publicly routable client — the open Internet dials the

            name. On a destination, the domain''s own public origin. Only `true` is

            meaningful; omit the field otherwise.'
        vmId:
          type:
          - string
          - 'null'
          description: 'A single VM, by id or by your slug for it. On a source, the VM that may

            open the session; on a destination, the VM it lands on. Answers hold its id.'
        vpcId:
          type:
          - string
