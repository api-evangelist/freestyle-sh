openapi: 3.2.0
info:
  title: Freestyle TLS API
  description: '# Powerful Virtual Machines


    Documentation: freestyle.sh/docs


    Freestyle VMs are full Linux virtual machines designed for long running, complex tasks. ## Key Features


    - **Instant Startup**: Freestyle VMs provision in milliseconds, with p99s under 400ms. - **Persistence**: Freestyle VMs can run forever, they can be hibernated with their exact memory in place and come back to life weeks later instantly, in that exact state. - **Powerful**: Freestyle VMs go up to 64GB of RAM for public tiers and much further for enterprise. Freestyle does high quality hardware virtualization supporting nested virtualization, FUSE, eBPF, full Linux networking and more. If it can run in an EC2, it can run in a Freestyle VM. - **Cheaply Snapshottable and Branchable**: Freestyle VMs are instantly and cheaply snapshottable (sub 1ms interruption, sub 50ms to snapshot ready). These snapshots can be used to create new VMs in the exact state of the original VM (memory and disk). This enables powerful workflows like branching, cloning, and rapid recovery from failures. ## When to use Freestyle


    - **Long Running Agent Tasks**: When you have tasks that take hours, days, weeks or months to run, Freestyle VMs provide a persistent and powerful environment that your agent can work in to completion. - **Failure Prone/Experimental Exploration**: When your tasks involve branching, cloning or need time travel Freestyle VMs are ideal because of their cheap snapshottability and power that makes them great for experiments. - **Complex Coding Problems**: When you are tackling advanced coding problems in research or production codebases, poor virtualization and small sandboxes will not cut it. Freestyle VMs provide the necessary resources and environment to handle these challenges effectively. - **Multi Tenant Usage Patterns**: Freestyle VMs are intentionally built to be used by agent builders with multiple customers. The slug system allows for keying VMs by their user, the identity system allows for granular acccess control and permissioning, and the VPC system allows for multi-tenant network isolation. ## When not to use it


    - **"Run AI Code"**: If your exclusively executing short lived Python scripts or other ephemeral tasks the benefits above aren''t relevant. Freestyle VMs should still be benchmarked but there may be alternatives better suited. - **CPU Intensive CI/CD**: Freestyle VMs run on bare metal on data center CPUs. We also oversubscribe host resources. For workloads that require sustained high CPU usage like building the Linux Kernel or mining crypto prefer cloud providers that offer consumer CPU performance. - **Short Lived Tasks**: If your tasks are extremely short lived and do not benefit from persistence or powerful hardware. If your average task takes less than 15 minutes to complete then they are likely cheaply retryable and don''t require the reliability and persistence that Freestyle VMs provide. - **Sole Application Hosting**: Freestyle VMs are designed as workbenches for development, experimentation and task execution. Not for hosting production applications. Hosting a minecraft server for some friends will work great on Freestyle, but we do not offer autoscaling, load balancers or CDNs and we don''t plan to. ## Emerging Use Cases


    - **RL Environments**: Freestyle VMs are well-suited for running reinforcement learning environments that require persistent state and complex setups. The ability to snapshot and branch VMs allows researchers to experiment with different strategies and record environment states efficiently. - **Auto Research Climbing**: Freestyle VMs are great for auto research as the snapshotting and fan out allows research agents to explore multiple strategies, review past results and iterate efficiently without ever losing progress.'
  license:
    name: ''
  version: 0.1.0
security:
- apiKey: []
tags:
- name: TLS
paths:
  /tls:
    get:
      tags:
      - TLS
      description: List your TLS rules, newest first. Filter by `vmId` to get the rules that apply to one VM — those naming it, plus those naming a private network it is attached to — by `vpcId` for the rules naming a private network, or by `domain` for the rules written on exactly that name.
      operationId: list_tls_rules
      parameters:
      - name: vmId
        in: query
        description: 'Rules that apply to this VM: those naming it, plus those naming a private

          network it is attached to. Its id, or your slug for it.'
        required: false
        schema:
          type: string
      - name: vpcId
        in: query
        description: Rules naming this private network. Its id, or your slug for it.
        required: false
        schema:
          type: string
      - name: domain
        in: query
        description: 'Rules for exactly this domain, as written on the rule (e.g.

          `app.acme.com` or `*.acme.com`).'
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: The account's TLS rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTlsRulesResponse'
        '404':
          description: 'NOT_FOUND: a `vmId` or `vpcId` filter names something that does not exist in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: List tls rules
      x-summary-source: derived
    post:
      tags:
      - TLS
      description: 'Allow a named session over a domain: a session addressed to `domain`, from `source`, to `destination`. A `source` says who may open it (`vmId`/`vpcId`/`public: true`); a `destination` says where it lands (`vmId`+`port`, `host`+`port`, or `public: true` for the domain''s own origin). A `transform` rewrites the session in flight — setting a header, or completing a Postgres handshake with credentials the guest never holds; its secrets are write-only and read back as `"***"`. A rule naming a VM or private network is deleted automatically when that resource is.'
      operationId: create_tls_rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTlsRuleRequest'
        required: true
      responses:
        '200':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsRule'
        '400':
          description: 'BAD_REQUEST: an unknown field, an endpoint that identifies nothing, a landing without a port, or a transform that disagrees with the protocol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: the rule names a VM or network that does not exist in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: your account is at its TLS rule limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Create tls rule
      x-summary-source: derived
  /tls/forward-auth:
    get:
      tags:
      - TLS
      description: List your reusable HTTP authorization checks, newest first.
      operationId: list_tls_forward_auth
      responses:
        '200':
          description: The account's forward-auth configurations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTlsForwardAuthResponse'
      deprecated: true
      summary: List tls forward auth
      x-summary-source: derived
    post:
      tags:
      - TLS
      description: Create a reusable authorization check for public HTTP ingress. Freestyle sends a bodyless GET to the HTTPS endpoint before waking or forwarding to the VM. Static header values are write-only and sealed at rest.
      operationId: create_tls_forward_auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTlsForwardAuthRequest'
        required: true
      responses:
        '200':
          description: Configuration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsForwardAuth'
        '400':
          description: 'BAD_REQUEST: the URL, timeout, header, or cookie configuration is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: your account is at its forward-auth configuration limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '503':
          description: 'UNAVAILABLE: secret sealing is not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Create tls forward auth
      x-summary-source: derived
  /tls/forward-auth/{forwardAuthId}:
    get:
      tags:
      - TLS
      description: Fetch one reusable authorization check. Static header values read back as `"***"`.
      operationId: get_tls_forward_auth
      parameters:
      - name: forwardAuthId
        in: path
        description: forwardAuth configuration id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsForwardAuth'
        '404':
          description: 'NOT_FOUND: no such configuration in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Get tls forward auth
      x-summary-source: derived
    put:
      tags:
      - TLS
      description: Replace a reusable authorization check in place, including rotating its static headers. Rules keep referencing the same id.
      operationId: update_tls_forward_auth
      parameters:
      - name: forwardAuthId
        in: path
        description: forwardAuth configuration id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTlsForwardAuthRequest'
        required: true
      responses:
        '200':
          description: Configuration replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsForwardAuth'
        '400':
          description: 'BAD_REQUEST: the replacement is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such configuration in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '503':
          description: 'UNAVAILABLE: secret sealing is not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Update tls forward auth
      x-summary-source: derived
    delete:
      tags:
      - TLS
      description: Delete an unused authorization check. A configuration referenced by a TLS rule cannot be deleted.
      operationId: delete_tls_forward_auth
      parameters:
      - name: forwardAuthId
        in: path
        description: forwardAuth configuration id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Configuration deleted
        '404':
          description: 'NOT_FOUND: no such configuration in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: one or more TLS rules still reference the configuration'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Delete tls forward auth
      x-summary-source: derived
