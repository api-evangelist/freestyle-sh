          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileStat'
        '400':
          description: 'BAD_REQUEST: the path is not absolute, contains `..`, or is over 4096 characters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such VM, or no such path in the guest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Stat path
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/fs/uploads:
    post:
      tags:
      - Filesystem
      description: Start a chunked upload of a large file (up to 16 GiB) into the VM. Send the bytes with `PUT /fs/uploads/{uploadId}`, then finish with `commit`.
      operationId: begin_upload
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginUploadRequest'
        required: true
      responses:
        '200':
          description: Session created; upload chunks next
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionStatus'
        '400':
          description: 'BAD_REQUEST: invalid path, size over 16 GiB, or malformed sha256'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: too many open upload sessions for this VM'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Begin upload
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/fs/uploads/{uploadId}:
    get:
      tags:
      - Filesystem
      description: Fetch an upload session's progress — use `receivedBytes` as the next chunk's offset when resuming after a failed chunk.
      operationId: upload_status
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      - name: uploadId
        in: path
        description: Upload session id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Session progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionStatus'
        '404':
          description: 'NOT_FOUND: no such session (sessions expire after an hour idle and do not survive host restarts)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Upload status
      x-summary-source: derived
    put:
      tags:
      - Filesystem
      description: Append one chunk of raw bytes to an upload session at the given offset. Chunks must arrive in order; on any transport error, re-fetch the session and resume from its `receivedBytes`. Keep chunks small enough to retry cheaply (the SDK uses 16 MiB; the hard cap is 256 MiB).
      operationId: upload_chunk
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      - name: uploadId
        in: path
        description: Upload session id
        required: true
        schema:
          type: string
      - name: offset
        in: query
        description: 'Byte offset this chunk starts at. Must equal the session''s current

          `receivedBytes`; chunks at an already-received offset are acknowledged

          without rewriting (safe retries), and offsets beyond it are rejected.'
        required: true
        schema:
          type: integer
          format: int64
          minimum: 0
      requestBody:
        description: The chunk's raw bytes
        content:
          application/octet-stream:
            schema:
              type: array
              items:
                type: integer
                format: int32
                minimum: 0
        required: true
      responses:
        '200':
          description: Chunk stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionStatus'
        '400':
          description: 'BAD_REQUEST: the chunk overruns the declared size'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: the offset leaves a gap, or the session is committing'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '413':
          description: 'PAYLOAD_TOO_LARGE: the chunk exceeds 256 MiB'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Upload chunk
      x-summary-source: derived
    delete:
      tags:
      - Filesystem
      description: Abandon an upload session and free its server-side spool space.
      operationId: abort_upload
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      - name: uploadId
        in: path
        description: Upload session id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Session discarded
        '404':
          description: 'NOT_FOUND: no such session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: the session is committing and cannot be aborted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Abort upload
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/fs/uploads/{uploadId}/commit:
    post:
      tags:
      - Filesystem
      description: 'Finish an upload: the file is verified (size, and sha256 when declared) and renamed into place inside the guest atomically — the target path never holds a partial file. On success the session is gone; on failure it remains and commit may be retried.'
      operationId: commit_upload
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      - name: uploadId
        in: path
        description: Upload session id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: File committed
        '400':
          description: 'BAD_REQUEST: not all bytes were uploaded, or the sha256 does not match'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: a commit is already in progress'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Commit upload
      x-summary-source: derived
  /v5/vms/{vmIdOrSlug}/fs/write:
    put:
      tags:
      - Filesystem
      description: 'Write a file inside the VM, atomically: the path holds the old file until the new one has arrived intact, never a half-written one.


        Send the file as the raw request body (with `?path=`) and it can be as large as 16 GiB — nothing buffers it whole. Send a JSON body instead (up to 32 MiB) when it is easier to type than to upload, as from this page.


        This is a single attempt: if the connection drops, the write starts over. To upload something big over a link you do not trust, open an upload session (`POST /fs/uploads`) and send retryable chunks instead.'
      operationId: write_file
      parameters:
      - name: vmIdOrSlug
        in: path
        description: VM id, or your slug for it
        required: true
        schema:
          type: string
      - name: path
        in: query
        description: 'Absolute path inside the guest. Required when the body is raw bytes;

          omitted when sending a JSON body, which carries its own `path`.'
        required: false
        schema:
          type: string
      - name: mode
        in: query
        description: 'Final file mode bits (e.g. 493 for `0o755`). Defaults to the target''s

          existing mode, or `0o600` for a new file.'
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: sha256
        in: query
        description: 'Optional sha256 of the file as 64 hex characters. Supplied, the write is

          rejected unless the received bytes match.'
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteFileRequest'
          application/octet-stream:
            schema:
              type: array
              items:
                type: integer
                format: int32
                minimum: 0
        required: true
      responses:
        '204':
          description: File written
        '400':
          description: 'BAD_REQUEST: invalid path, malformed body, or a sha256 that does not match the bytes received'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such VM in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: the VM stopped responding around the commit (`VM_NON_RESPONSIVE` — the upload may have committed; read the file back before re-uploading)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '413':
          description: 'PAYLOAD_TOO_LARGE: a JSON body over 32 MiB, or a file over 16 GiB'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      summary: Write file
      x-summary-source: derived
