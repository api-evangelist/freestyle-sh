      x-operation-id-original: write_file
components:
  schemas:
    PublicErrorBody:
      type: object
      description: 'The shape of every error response: a stable machine-readable `code` and a

        human-readable `message`. The HTTP status carries the class of failure.


        Some errors add fields alongside these two; `code` and `message` are always

        present.'
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'A stable identifier for the failure, in `SCREAMING_SNAKE_CASE`. Branch

            on this; `message` is prose and may be reworded at any time.'
          example: NOT_FOUND
        message:
          type: string
          description: 'A human-readable explanation of what went wrong. A fault inside the

            platform is always reported as `INTERNAL_ERROR` with no further detail.'
          example: vm vm-1234 not found
    BeginUploadRequest:
      type: object
      description: Starts an upload session.
      required:
      - path
      - size
      properties:
        mode:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Optional final file mode bits (e.g. 493 for `0o755`). Defaults to the

            target''s existing mode, or `0o600` for a new file.'
          minimum: 0
        path:
          type: string
          description: Absolute path inside the guest the finished file is committed to.
        sha256:
          type:
          - string
          - 'null'
          description: 'Optional sha256 of the full file as 64 hex characters; the upload is

            rejected at commit if the received bytes do not match.'
        size:
          type: integer
          format: int64
          description: Total file size in bytes, up to 16 GiB.
          minimum: 0
    PathExistsResponse:
      type: object
      required:
      - exists
      properties:
        exists:
          type: boolean
    DirEntry:
      type: object
      required:
      - name
      - kind
      properties:
        kind:
          type: string
          description: '`file`, `directory`, or `symlink`.'
        name:
          type: string
    MakeDirRequest:
      type: object
      description: 'The public mkdir body. The internal API takes a bare `{path}` here while its

        sibling `remove` takes a query parameter; the public surface keeps the same

        wire shapes but documents both explicitly.'
      required:
      - path
      properties:
        path:
          type: string
          description: Absolute path inside the guest.
    WriteFileRequest:
      type: object
      description: 'The JSON form of a write: convenient from a docs page or a shell, capped at

        32 MiB. Larger files go as raw bytes on the same endpoint.'
      required:
      - path
      - content
      properties:
        content:
          type: string
          description: The file's content, interpreted per `encoding`.
        encoding:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ContentEncoding'
            description: Defaults to `utf8`.
        mode:
          type:
          - integer
          - 'null'
          format: int32
          description: Final file mode bits (e.g. 493 for `0o755`).
          minimum: 0
        path:
          type: string
          description: Absolute path inside the guest.
        sha256:
          type:
          - string
          - 'null'
          description: Optional sha256 of the file as 64 hex characters.
    FileStat:
      type: object
      required:
      - size
      - isFile
      - isDirectory
      - isSymlink
      - permissions
      - owner
      - group
      - modified
      properties:
        group:
          type: string
        isDirectory:
          type: boolean
        isFile:
          type: boolean
        isSymlink:
          type: boolean
        modified:
          type: string
        owner:
          type: string
        permissions:
          type: string
          description: Octal mode, e.g. `0644`.
        size:
          type: integer
          format: int64
          description: Size in bytes.
          minimum: 0
    ReadDirResponse:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DirEntry'
    UploadSessionStatus:
      type: object
      required:
      - uploadId
      - path
      - size
      - receivedBytes
      properties:
        path:
          type: string
          description: Absolute guest path the file will be committed to.
        receivedBytes:
          type: integer
          format: int64
          description: Bytes stored so far — the offset the next chunk must start at.
          minimum: 0
        size:
          type: integer
          format: int64
          description: Total declared file size in bytes.
          minimum: 0
        uploadId:
          type: string
    ContentEncoding:
      type: string
      description: How `content` is encoded in the JSON form of a write.
      enum:
      - utf8
      - base64
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'Your Freestyle API key, sent as `Authorization: Bearer <api key>`. Every request needs one unless it is authenticated with an identity access token instead.'
    identityAccessToken:
      type: apiKey
      in: header
      name: x-freestyle-identity-access-token
      description: An access token belonging to an identity you created. It reaches only the VMs that identity has been granted, and only their exec and terminal routes. Hand one to an end user instead of your API key.
