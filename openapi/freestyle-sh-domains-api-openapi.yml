openapi: 3.2.0
info:
  title: Freestyle Sh Domains API
  version: 0.1.0
  description: 'Operations tagged Domains across 2 of this provider''s published API definitions: freestyle-domains-api-openapi.yml, freestyle-sh-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.freestyle.sh
  description: Production
tags:
- name: Domains
  description: 'APIs for managing domains. This is only relevant when you want to start to deploy to custom domains.

    Please read this guide to understand how deployments work with custom domains.'
paths:
  /domains/v1/certs/{domain}/wildcard:
    post:
      tags:
      - Domains
      summary: Provision a Wildcard Certificate
      description: 'Provisions a wildcard certificate for a verified domain


        This speeds up deploys on all subdomains of the domain. In order to use it, you must add the following record to your DNS config:


        `_acme-challenge.yourdomain.com` NS `dns.freestyle.sh`'
      operationId: handle_verify_wildcard
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Domain verified
          content:
            application/json:
              schema:
                type: object
                required:
                - domain
                properties:
                  domain:
                    type: string
                    example: example.com
        '400':
          description: Failed to preverify domain
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
      security:
      - bearerAuth: []
    servers:
    - url: https://api.freestyle.sh
      description: Production
  /domains/v1/domains:
    get:
      tags:
      - Domains
      summary: List Domains for an Account
      description: This lists the domains that an account has verified ownership of. This includes the *.style.dev domains the account has claimed.
      operationId: handle_list_domains
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: implicitlyOwned
        in: query
        required: false
        schema:
          type:
          - boolean
          - 'null'
      responses:
        '200':
          description: List of domains
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - domain
                  - accountId
                  - createdAt
                  - id
                  - verifiedDns
                  - implicitlyOwned
                  - deployToDomain
                  - manageDns
                  - deployToSubdomains
                  properties:
                    domain:
                      type: string
                    accountId:
                      type: string
                      format: uuid
                    createdAt:
                      type: string
                      format: date-time
                    id:
                      type: string
                      format: uuid
                    verifiedDns:
                      type: boolean
                    implicitlyOwned:
                      type: boolean
                    deployToDomain:
                      type: boolean
                    manageDns:
                      type: boolean
                    deployToSubdomains:
                      type: boolean
        '400':
          description: Failed to get domains
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
      security:
      - bearerAuth: []
    servers:
    - url: https://api.freestyle.sh
      description: Production
  /domains/v1/mappings:
    get:
      tags:
      - Domains
      summary: List Domain Mappings
      description: List domain mappings for any query based on exact domain or domain ownership (the domain ownership that gave the right to use the domain)
      operationId: handle_list_domain_mappings
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: limit
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: domainOwnership
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: domain
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: List of domain mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FreestyleSandboxDomainMapping'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
    servers:
    - url: https://api.freestyle.sh
      description: Production
  /domains/v1/mappings/{domain}:
    post:
      tags:
      - Domains
      summary: Insert Domain Mapping
      description: This will unmap any other deployment to this domain. Provide either deployment_id or vm_id (with optional vm_port), but not both.
      operationId: handle_insert_domain_mapping
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainMappingRequest'
        required: true
      responses:
        '200':
          description: Successfully mapped domain to deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDomainMappingSuccess'
        4XX:
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Public_DomainMappingError'
        5XX:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Public_DomainMappingError'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Domains
      summary: Remove Domain Mapping
      operationId: handle_delete_domain_mapping
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully deleted domain mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfullyDeletedDomainMapping'
        '400':
          description: 'Possible errors: DomainAlreadyExists, InvalidRequest'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
        '401':
          description: 'Possible errors: FailedPermissionsCheck, DeploymentAccessDenied, VmAccessDeniedForMapping, DomainOwnershipNotVerified'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
        '422':
          description: 'Error: FailedToProvisionCertificateForMapping'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
        '500':
          description: 'Possible errors: FailedRemoveDomainMapping, FailedToInsertOwnership, FailedInsertDomainMapping'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
        '502':
          description: 'Error: FailedToCheckDomainMappingPermissions'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
      security:
      - bearerAuth: []
    servers:
    - url: https://api.freestyle.sh
      description: Production
  /domains/v1/verifications:
    get:
      tags:
      - Domains
      summary: List Domain Verification Requests for an Account
      description: Lists domain verification requests for the current account.
      operationId: handle_list_domain_verification_requests
      responses:
        '200':
          description: List of verification codes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - verificationCode
                  - domain
                  - createdAt
                  properties:
                    verificationCode:
                      type: string
                    domain:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
        '400':
          description: Failed to get verification codes
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
      security:
      - bearerAuth: []
    put:
      tags:
      - Domains
      summary: Verify a Domain Verification Request
      description: This checks a pre-existing verification request for a domain. To create a verification request, call the create domain verification endpoint. This endpoint will check if the domain has a TXT record with the verification code. If it does, the domain will be verified.
      operationId: handle_verify_domain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreestyleVerifyDomainRequest'
        required: true
      responses:
        '200':
          description: Domain verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyDomainSuccess'
        '400':
          description: 'Possible errors: InvalidDomain, FailedToCreateVerificationCode, FailedToDeleteVerification, VerificationFailed'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
        '401':
          description: 'Error: PermissionDenied'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
        '403':
          description: 'Error: LimitExceeded'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
        '404':
          description: 'Error: VerificationNotFound'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
        '422':
          description: 'Error: FailedToProvisionCertificate'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
        '500':
          description: 'Possible errors: FailedToVerifyDomain, FailedToListVerifications, FailedToListDomains, FailedToInsertDomainMapping, InternalError'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
        '502':
          description: 'Error: FailedToCheckPermissions'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    description: Error code in SCREAMING_SNAKE_CASE
                  message:
                    type: string
                    description: Human-readable error message
      security:
      - bearerAuth: []
    post:
      tags:
      - Domains
      summary: Create a Domain Verification Request
      description: This creates a Freestyle Domain Verification Request. It returns a `verificationCode` for your domain. You need to place this code in a TXT record at `_freestyle_custom_hostname.thedomain.com`, then call the verify domain endpoint with the domain to verify it.
      operationId: handle_create_domain_verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreestyleDomainVerificationRequest'
        required: true
      responses:
        '200':
          description: Verification code created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainVerificationRequest'
        '400':
          description: Failed to create verification code
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
      security:
      - bearerAuth: []
    delete:
      tags:
      - Domains
      summary: Delete a Domain Verification Request
      description: This deletes a Freestyle Domain Verification Request. This does not remove the domain from the account if it has already been verified, however the verification code will no longer be valid.
      operationId: handle_delete_domain_verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreestyleDeleteDomainVerificationRequest'
        required: true
      responses:
        '200':
          description: Verification code created
          content:
            application/json:
              schema:
                type: object
                required:
                - verificationCode
                - domain
                properties:
                  verificationCode:
                    type: string
                  domain:
                    type: string
                    example: example.com
        '400':
          description: Failed to create verification code
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
      security:
      - bearerAuth: []
    servers:
    - url: https://api.freestyle.sh
      description: Production
  /certificates:
    get:
      tags:
      - Domains
      description: List your certificates.
      operationId: list_certificates
      responses:
        '200':
          description: Certificates issued for the account's domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCertificatesResponse'
      deprecated: true
      security:
      - apiKey: []
      summary: List certificates
      x-summary-source: derived
  /certificates/wildcard:
    post:
      tags:
      - Domains
      description: Request an ongoing `*.domain` certificate. Requires `_acme-challenge.` to be NS-delegated to Freestyle's nameservers, since wildcards can only be proven over DNS.
      operationId: request_wildcard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestWildcardRequest'
        required: true
      responses:
        '200':
          description: Ongoing wildcard certificate requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateInfo'
        '400':
          description: 'INVALID_DOMAIN: not a valid domain name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '403':
          description: 'DOMAIN_NOT_OWNED: you have not verified this domain or a parent of it'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      security:
      - apiKey: []
      summary: Request wildcard
      x-summary-source: derived
  /domains:
    get:
      tags:
      - Domains
      description: List the domains you hold — those you verified, and any Freestyle subdomain you have taken by publishing it.
      operationId: list_domains
      responses:
        '200':
          description: Domains the account holds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDomainsResponse'
      deprecated: true
      security:
      - apiKey: []
      summary: List domains
      x-summary-source: derived
  /domains/placeholder:
    get:
      tags:
      - Domains
      description: The branding your placeholder pages wear. A placeholder page is what a browser sees for a hostname under one of your verified domains that none of your TLS rules serve.
      operationId: get_placeholder_branding
      responses:
        '200':
          description: Your placeholder branding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceholderBranding'
        '404':
          description: 'NOT_FOUND: no branding set; pages carry the Freestyle default'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      security:
      - apiKey: []
      summary: Get placeholder branding
      x-summary-source: derived
    put:
      tags:
      - Domains
      description: Set the branding for every placeholder page under your verified domains — including domains you verify later. The page keeps its behaviour (a 404 that reloads itself until a route appears); only the logo and the name change. Replaces any earlier setting.
      operationId: set_placeholder_branding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlaceholderBrandingRequest'
        required: true
      responses:
        '200':
          description: Branding saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceholderBranding'
        '400':
          description: 'INVALID_REQUEST: the logo URL is not an absolute https URL, or a field is too long'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      security:
      - apiKey: []
      summary: Set placeholder branding
      x-summary-source: derived
    delete:
      tags:
      - Domains
      description: Remove your placeholder branding. Pages go back to the Freestyle default.
      operationId: delete_placeholder_branding
      responses:
        '204':
          description: Branding removed
        '404':
          description: 'NOT_FOUND: no branding was set'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      security:
      - apiKey: []
      summary: Delete placeholder branding
      x-summary-source: derived
  /v5/certificates:
    get:
      tags:
      - Domains
      description: List your certificates.
      operationId: getV5Certificates
      responses:
        '200':
          description: Certificates issued for the account's domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCertificatesResponse'
      security:
      - apiKey: []
      summary: List certificates
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: list_certificates
  /v5/certificates/wildcard:
    post:
      tags:
      - Domains
      description: Request an ongoing `*.domain` certificate. Requires `_acme-challenge.` to be NS-delegated to Freestyle's nameservers, since wildcards can only be proven over DNS.
      operationId: postV5CertificatesWildcard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestWildcardRequest'
        required: true
      responses:
        '200':
          description: Ongoing wildcard certificate requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateInfo'
        '400':
          description: 'INVALID_DOMAIN: not a valid domain name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '403':
          description: 'DOMAIN_NOT_OWNED: you have not verified this domain or a parent of it'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      security:
      - apiKey: []
      summary: Request wildcard
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: request_wildcard
  /v5/domains:
    get:
      tags:
      - Domains
      description: List the domains you hold — those you verified, and any Freestyle subdomain you have taken by publishing it.
      operationId: getV5Domains
      responses:
        '200':
          description: Domains the account holds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDomainsResponse'
      security:
      - apiKey: []
      summary: List domains
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: list_domains
  /v5/domains/placeholder:
    get:
      tags:
      - Domains
      description: The branding your placeholder pages wear. A placeholder page is what a browser sees for a hostname under one of your verified domains that none of your TLS rules serve.
      operationId: getV5DomainsPlaceholder
      responses:
        '200':
          description: Your placeholder branding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceholderBranding'
        '404':
          description: 'NOT_FOUND: no branding set; pages carry the Freestyle default'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      security:
      - apiKey: []
      summary: Get placeholder branding
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: get_placeholder_branding
    put:
      tags:
      - Domains
      description: Set the branding for every placeholder page under your verified domains — including domains you verify later. The page keeps its behaviour (a 404 that reloads itself until a route appears); only the logo and the name change. Replaces any earlier setting.
      operationId: putV5DomainsPlaceholder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlaceholderBrandingRequest'
        required: true
      responses:
        '200':
          description: Branding saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceholderBranding'
        '400':
          description: 'INVALID_REQUEST: the logo URL is not an absolute https URL, or a field is too long'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      security:
      - apiKey: []
      summary: Set placeholder branding
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: set_placeholder_branding
    delete:
      tags:
      - Domains
      description: Remove your placeholder branding. Pages go back to the Freestyle default.
      operationId: deleteV5DomainsPlaceholder
      responses:
        '204':
          description: Branding removed
        '404':
          description: 'NOT_FOUND: no branding was set'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      security:
      - apiKey: []
      summary: Delete placeholder branding
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: delete_placeholder_branding
  /v5/verifications:
    get:
      tags:
      - Domains
      description: List your verification challenges.
      operationId: list_verifications
      parameters:
      - name: state
        in: query
        description: 'Narrow to one state. Omit for every challenge the account holds,

          verified records included.'
        required: false
        schema:
          $ref: '#/components/schemas/VerificationState'
      responses:
        '200':
          description: The account's verification challenges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVerificationsResponse'
      security:
      - apiKey: []
      summary: List verifications
      x-summary-source: derived
    post:
      tags:
      - Domains
      description: Issue a challenge. Publish the returned `verificationCode` as a TXT record at `recordName`, then PUT the verification to complete it.
      operationId: create_verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationRequest'
        required: true
      responses:
        '200':
          description: Verification challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainVerification'
        '400':
          description: 'INVALID_DOMAIN: not a valid domain name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      security:
      - apiKey: []
      summary: Create verification
      x-summary-source: derived
  /v5/verifications/{domainOrId}:
    get:
      tags:
      - Domains
      description: Fetch a verification challenge by its id or its domain.
      operationId: get_verification
      parameters:
      - name: domainOrId
        in: path
        description: Verification id or the domain under verification
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The pending verification challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainVerification'
        '404':
          description: 'NOT_FOUND: no verification challenge for the id or domain'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      security:
      - apiKey: []
      summary: Get verification
      x-summary-source: derived
    put:
      tags:
      - Domains
      description: Check DNS and record ownership. Addressed by id, only that challenge's own code counts, and the result names it. Use this when several people are verifying the same domain.
      operationId: verify_domain
      parameters:
      - name: domainOrId
        in: path
        description: Verification id, or the domain to verify
        required: true
        schema:
          type: string
      responses:
        '200':
          description: TXT record checked; ownership recorded
          content:
            application/json:
              schema:
