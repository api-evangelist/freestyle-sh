components:
  schemas:
    Vpc:
      type: object
      description: A private network. Its VXLAN id is a cluster internal and is not published.
      required:
      - id
      - cidrV6
      - createdAt
      properties:
        cidr:
          type:
          - string
          - 'null'
          description: 'The network''s IPv4 CIDR block, when it has one. Networks are

            IPv6-first; IPv4 is opt-in at create.'
        cidrV6:
          type: string
          description: The network's IPv6 CIDR block — always present.
        createdAt:
          type: string
          format: date-time
        displayName:
          type:
          - string
          - 'null'
        id:
          $ref: '#/components/schemas/VpcId'
        slug:
          type:
          - string
          - 'null'
    ListTunnelsResponse:
      type: object
      required:
      - tunnels
      - totalCount
      properties:
        totalCount:
          type: integer
          minimum: 0
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/Tunnel'
          description: 'Newest first. Listings never carry a private key; the config returned

            here has `PrivateKey` blanked.'
    PublicErrorBody:
      type: object
      description: 'The shape of every error response: a stable machine-readable `code` and a

        human-readable `message`. The HTTP status carries the class of failure.


        Some errors add fields alongside these two; `code` and `message` are always

        present.'
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'A stable identifier for the failure, in `SCREAMING_SNAKE_CASE`. Branch

            on this; `message` is prose and may be reworded at any time.'
          example: NOT_FOUND
        message:
          type: string
          description: 'A human-readable explanation of what went wrong. A fault inside the

            platform is always reported as `INTERNAL_ERROR` with no further detail.'
          example: vm vm-1234 not found
    CreateVpcRequest:
      type: object
      properties:
        cidr:
          type:
          - string
          - 'null'
          description: 'The network''s IPv4 CIDR. Networks are dual-stack; a `/24` out of

            `10.0.0.0/8` is derived for you when omitted. Name one to choose the

            range yourself — worth doing when the network has to reach an existing

            estate over a tunnel and must not overlap it, or when it needs more

            than 254 IPv4 members.'
        cidrV6:
          type:
          - string
          - 'null'
          description: 'The network''s IPv6 CIDR; a unique-local /64 is derived for you when

            omitted.'
        displayName:
          type:
          - string
          - 'null'
        firewall:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FirewallSpec'
            description: 'Firewall rules created with the network and deleted with it. A bare

              endpoint means the network being created, so

              `{"source":{},"destination":{}}` is "members reach each other".'
        slug:
          type:
          - string
          - 'null'
    ListVpcIpsResponse:
      type: object
      required:
      - ips
      - totalCount
      properties:
        ips:
          type: array
          items:
            $ref: '#/components/schemas/VpcIpReservation'
        totalCount:
          type: integer
          minimum: 0
    ListVpcsResponse:
      type: object
      required:
      - vpcs
      - totalCount
      properties:
        totalCount:
          type: integer
          minimum: 0
        vpcs:
          type: array
          items:
            $ref: '#/components/schemas/Vpc'
    Tunnel:
      type: object
      description: 'A tunnel: your WireGuard identity on the platform. It exists until you

        delete it: connect, disconnect and reconnect as often as you like — a

        session is set up on the handshake that needs it, so an idle tunnel costs

        nothing and never expires. A tunnel routes nowhere until you attach a

        private network to it; attach several and one WireGuard interface reaches

        them all.'
      required:
      - id
      - clientConfig
      - endpointPort
      - clientPublicKey
      - serverPublicKey
      - clientAddressV4
      - clientAddressV6
      - routes
      - attachments
      - createdAt
      - updatedAt
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/TunnelAttachment'
          description: The private networks on the far side, oldest attachment first.
        clientAddressV4:
          type: string
          description: 'Your fixed addresses inside the tunnel. Only the gateway ever sees

            them: each attached network sees an address inside its own subnet

            instead (`attachments[].address`).'
        clientAddressV6:
          type: string
        clientConfig:
          type: string
          description: 'A complete WireGuard config file, fixed for the life of the tunnel:

            attaching and detaching networks never changes it, so bring it up once

            and manage what it reaches through the API. `PrivateKey` is blank

            except on create and rotate-key, the only two responses that mint a

            keypair.'
        clientPublicKey:
          type: string
        createdAt:
          type: string
          format: date-time
        displayName:
          type:
          - string
          - 'null'
          description: Your label for this tunnel, if you gave it one.
        endpointHost:
          type:
          - string
          - 'null'
          description: Host to dial.
        endpointPort:
          type: integer
          format: int32
          minimum: 0
        id:
          type: string
          description: 'Deprecated: the tunnel''s id under its old name. Read `tunnelId`.'
        routes:
          type: array
          items:
            type: string
          description: 'The ranges your client routes through the tunnel — its `AllowedIPs`,

            fixed at create. A network can only be attached if its CIDRs fall

            inside these.'
        serverPublicKey:
          type: string
          description: The one `[Peer]` public key in your config.
        slug:
          type:
          - string
          - 'null'
          description: 'Your handle for this tunnel, if you gave it one. Usable anywhere the id

            is, in place of it.'
        tunnelId:
          type:
          - string
          - 'null'
          description: 'The tunnel''s id, under the name the rest of the API uses for it — a

            firewall rule says `tunnelId`, so the tunnel does too.'
        updatedAt:
          type: string
          format: date-time
    UpdateVpcRequest:
      type: object
      properties:
        displayName:
          type:
          - string
          - 'null'
          description: An empty string clears it.
        slug:
          type:
          - string
          - 'null'
          description: An empty string clears it.
    FirewallSpec:
      type: object
      description: 'The `firewall` block of a create: rules created with the resource and

        deleted with it. Inside it, an endpoint with no identity means the resource

        being created — which is how a rule names something whose id does not exist

        yet.'
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/CreateFirewallRuleRequest'
      additionalProperties: false
    TunnelAttachment:
      type: object
      description: 'One private network on the far side of a tunnel: the network, your address

        inside it, and the `[Peer]` key that carries it.'
      required:
      - vpcId
      - address
      - vpcCidr
      - allowedIps
      - createdAt
      properties:
        address:
          type: string
          description: 'Deprecated: the primary address, whichever family. Read `ipv4`/`ipv6`.'
        allowedIps:
          type: array
          items:
            type: string
          description: The CIDRs the gateway routes to this network.
        createdAt:
          type: string
          format: date-time
        exit:
          type: boolean
          description: 'Whether this attachment is a network exit: your client forwards for

            destinations that are not its own address, and members route through

            it with an ordinary route via the attachment''s address. Omitted when

            false.'
        ipv4:
          type:
          - string
          - 'null'
          description: 'Your IPv4 address inside the private network, absent on a v6-only

            attachment. It belongs to this tunnel for as long as the network stays

            attached, so you can write it into configs and rules.'
        ipv6:
          type:
          - string
          - 'null'
          description: Your IPv6 address inside the private network, under the same rules.
        remoteCidrs:
          type: array
          items:
            type: string
          description: 'Ranges behind your client that this network routes through the tunnel

            (a site-to-site grant). VMs reach them with an ordinary route via

            `address`. Omitted when the attachment has none.'
        secondaryAddress:
          type:
          - string
          - 'null'
          description: 'Deprecated: the second-family address. Read `ipv4`/`ipv6`.'
        vpcCidr:
          type: string
        vpcId:
          $ref: '#/components/schemas/VpcId'
    FirewallEndpoint:
      type: object
      description: 'One end of a rule: which traffic this side matches.


        Fields intersect — `{ vpcId, port, protocol }` is "traffic in that network,

        on that port, over that protocol". `vmId`/`vpcId`/`tunnelId` select by

        identity (the VM however it is addressed); `cidr`/`public` select by

        address. Unknown fields

        are rejected rather than ignored: a matcher is a security statement, and a

        typo''d `porrt: 22` that quietly became "every port" is the wrong failure.'
      properties:
        cidr:
          type:
          - string
          - 'null'
          description: An address range, IPv4 or IPv6, in canonical `network/prefix` form.
        port:
          type:
          - integer
          - 'null'
          format: int32
          description: A single port, 1–65535. Requires `protocol`.
          minimum: 0
        protocol:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FirewallProtocol'
        public:
          type:
          - boolean
          - 'null'
          description: 'Every publicly routable address, whoever owns it — including another

            Freestyle VM reached at its public address. Only `true` is meaningful;

            omit the field otherwise. Not combined with `vmId` or `vpcId`.'
        tunnelId:
          type:
          - string
          - 'null'
          description: 'Whatever is on the far side of one tunnel — the client that dials it,

            and any remote range routed over it. Tunnels have no slug, so this is a

            tunnel id: `tun-…`, or `wg-…` for one carried over from the per-VPC VPN

            records tunnels replaced.'
        vmId:
          type:
          - string
          - 'null'
          description: A single VM, by id or by your slug for it. Answers hold its id.
        vpcId:
          type:
          - string
          - 'null'
          description: 'Everything on one private network, by id or by your slug for it.

            Answers hold its id.'
      additionalProperties: false
    FirewallAction:
      type: string
      description: 'What a rule does with the traffic it matches.


        Only `allow` exists today, and it is required on every rule rather than

        defaulted: a default would mean that the day `deny` arrives, every rule

        written before it silently acquires an action it never stated.'
      enum:
      - allow
    CreateFirewallRuleRequest:
      type: object
      required:
      - action
      - source
      - destination
      properties:
        action:
          $ref: '#/components/schemas/FirewallAction'
          description: Required, and `allow` is the only accepted value.
        description:
          type:
          - string
          - 'null'
          description: A free-form note, up to 1024 characters.
        destination:
          $ref: '#/components/schemas/FirewallEndpoint'
        source:
          $ref: '#/components/schemas/FirewallEndpoint'
      additionalProperties: false
    VpcIpReservation:
      type: object
      description: One reserved address inside a private network.
      required:
      - ipv4
      - owner
      properties:
        ipv4:
          type: string
        owner:
          type: string
          description: 'Who holds the address: a VM id, or `wireguard:{attachmentId}` for a

            tunnel attachment''s address.'
    VpcId:
      type: string
      description: Identifies a VPC. Minted as `"vpc-<uuid>"`.
    FirewallProtocol:
      type: string
      description: The transport a matcher is restricted to.
      enum:
      - tcp
      - udp
      - icmp
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'Your Freestyle API key, sent as `Authorization: Bearer <api key>`. Every request needs one unless it is authenticated with an identity access token instead.'
    identityAccessToken:
      type: apiKey
      in: header
      name: x-freestyle-identity-access-token
      description: An access token belonging to an identity you created. It reaches only the VMs that identity has been granted, and only their exec and terminal routes. Hand one to an end user instead of your API key.
