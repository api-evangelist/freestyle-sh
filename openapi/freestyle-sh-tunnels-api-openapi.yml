openapi: 3.2.0
info:
  title: Freestyle Tunnels API
  description: '# Powerful Virtual Machines


    Documentation: freestyle.sh/docs


    Freestyle VMs are full Linux virtual machines designed for long running, complex tasks. ## Key Features


    - **Instant Startup**: Freestyle VMs provision in milliseconds, with p99s under 400ms. - **Persistence**: Freestyle VMs can run forever, they can be hibernated with their exact memory in place and come back to life weeks later instantly, in that exact state. - **Powerful**: Freestyle VMs go up to 64GB of RAM for public tiers and much further for enterprise. Freestyle does high quality hardware virtualization supporting nested virtualization, FUSE, eBPF, full Linux networking and more. If it can run in an EC2, it can run in a Freestyle VM. - **Cheaply Snapshottable and Branchable**: Freestyle VMs are instantly and cheaply snapshottable (sub 1ms interruption, sub 50ms to snapshot ready). These snapshots can be used to create new VMs in the exact state of the original VM (memory and disk). This enables powerful workflows like branching, cloning, and rapid recovery from failures. ## When to use Freestyle


    - **Long Running Agent Tasks**: When you have tasks that take hours, days, weeks or months to run, Freestyle VMs provide a persistent and powerful environment that your agent can work in to completion. - **Failure Prone/Experimental Exploration**: When your tasks involve branching, cloning or need time travel Freestyle VMs are ideal because of their cheap snapshottability and power that makes them great for experiments. - **Complex Coding Problems**: When you are tackling advanced coding problems in research or production codebases, poor virtualization and small sandboxes will not cut it. Freestyle VMs provide the necessary resources and environment to handle these challenges effectively. - **Multi Tenant Usage Patterns**: Freestyle VMs are intentionally built to be used by agent builders with multiple customers. The slug system allows for keying VMs by their user, the identity system allows for granular acccess control and permissioning, and the VPC system allows for multi-tenant network isolation. ## When not to use it


    - **"Run AI Code"**: If your exclusively executing short lived Python scripts or other ephemeral tasks the benefits above aren''t relevant. Freestyle VMs should still be benchmarked but there may be alternatives better suited. - **CPU Intensive CI/CD**: Freestyle VMs run on bare metal on data center CPUs. We also oversubscribe host resources. For workloads that require sustained high CPU usage like building the Linux Kernel or mining crypto prefer cloud providers that offer consumer CPU performance. - **Short Lived Tasks**: If your tasks are extremely short lived and do not benefit from persistence or powerful hardware. If your average task takes less than 15 minutes to complete then they are likely cheaply retryable and don''t require the reliability and persistence that Freestyle VMs provide. - **Sole Application Hosting**: Freestyle VMs are designed as workbenches for development, experimentation and task execution. Not for hosting production applications. Hosting a minecraft server for some friends will work great on Freestyle, but we do not offer autoscaling, load balancers or CDNs and we don''t plan to. ## Emerging Use Cases


    - **RL Environments**: Freestyle VMs are well-suited for running reinforcement learning environments that require persistent state and complex setups. The ability to snapshot and branch VMs allows researchers to experiment with different strategies and record environment states efficiently. - **Auto Research Climbing**: Freestyle VMs are great for auto research as the snapshotting and fan out allows research agents to explore multiple strategies, review past results and iterate efficiently without ever losing progress.'
  license:
    name: ''
  version: 0.1.0
security:
- apiKey: []
tags:
- name: Tunnels
paths:
  /tunnels:
    get:
      tags:
      - Tunnels
      description: 'List your tunnels, newest first. Listings never include a private key: one is returned only by create and rotate-key.'
      operationId: list_tunnels
      responses:
        '200':
          description: Your tunnels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTunnelsResponse'
      deprecated: true
      summary: List tunnels
      x-summary-source: derived
    post:
      tags:
      - Tunnels
      description: 'Create a tunnel, optionally attaching networks in the same call (`vpcs`, all-or-nothing). It lives until you delete it, and its config never changes: save it, bring it up once, and manage which networks it reaches by attaching and detaching them — no config updates, ever. Omit `clientPublicKey` and a keypair is minted for you — the response carries the only copy of the private key you will get.'
      operationId: create_tunnel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTunnelRequest'
        required: true
      responses:
        '200':
          description: Tunnel ready, with any requested networks attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedTunnel'
        '400':
          description: 'BAD_REQUEST: invalid slug, display name, public key, routes, or address'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: a named network does not exist in this account; nothing was created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: that slug is already used by another tunnel in your account, or a requested attachment was refused; nothing was created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Create tunnel
      x-summary-source: derived
  /tunnels/{tunnelIdOrSlug}:
    get:
      tags:
      - Tunnels
      description: Read one tunnel, with its attached networks. The config comes back with a blank `PrivateKey`; fill in the key you saved at create, or rotate to mint a new one.
      operationId: get_tunnel
      parameters:
      - name: tunnelIdOrSlug
        in: path
        description: Tunnel id, or your slug for it
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The tunnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tunnel'
        '404':
          description: 'NOT_FOUND: no such tunnel in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Get tunnel
      x-summary-source: derived
    delete:
      tags:
      - Tunnels
      description: Delete a tunnel, detaching every network as it goes. This is the only thing that ends one.
      operationId: delete_tunnel
      parameters:
      - name: tunnelIdOrSlug
        in: path
        description: Tunnel id, or your slug for it
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Tunnel deleted
        '404':
          description: 'NOT_FOUND: no such tunnel in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Delete tunnel
      x-summary-source: derived
    patch:
      tags:
      - Tunnels
      description: 'Rename a tunnel or change its slug. Only the labels move: the keys, addresses, routes and attached networks are untouched, so a connected client sees nothing change and the config you saved keeps working.'
      operationId: update_tunnel
      parameters:
      - name: tunnelIdOrSlug
        in: path
        description: Tunnel id, or your slug for it
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTunnelRequest'
        required: true
      responses:
        '200':
          description: The updated tunnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tunnel'
        '400':
          description: 'BAD_REQUEST: invalid slug or display name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such tunnel in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: that slug is already used by another tunnel in your account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Update tunnel
      x-summary-source: derived
  /tunnels/{tunnelIdOrSlug}/rotate-key:
    post:
      tags:
      - Tunnels
      description: 'Replace a tunnel''s keys, keeping its id and every attached network''s address. Use this if you lost the config or need to revoke one that leaked: the old keys stop working, and the response carries the only copy of the new private key you will get.'
      operationId: rotate_tunnel_key
      parameters:
      - name: tunnelIdOrSlug
        in: path
        description: Tunnel id, or your slug for it
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateTunnelKeyRequest'
        required: true
      responses:
        '200':
          description: Keys rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedTunnel'
        '400':
          description: 'BAD_REQUEST: that is not a valid WireGuard public key'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such tunnel in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Rotate tunnel key
      x-summary-source: derived
  /tunnels/{tunnelIdOrSlug}/vpcs/{vpcIdOrSlug}:
    post:
      tags:
      - Tunnels
      description: Attach a private network to a tunnel. The tunnel gains an address inside the network — what that network's VMs see as your address — and a connected client can reach the network immediately, with no config change. Omit `ipv4` and an address is assigned; supply one to pin it. The network's CIDRs must fall inside the tunnel's routes and must not overlap another attached network's.
      operationId: attach_vpc_to_tunnel
      parameters:
      - name: tunnelIdOrSlug
        in: path
        description: Tunnel id, or your slug for it
        required: true
        schema:
          type: string
      - name: vpcIdOrSlug
        in: path
        description: VPC id, or your slug for it
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachVpcRequest'
        required: true
      responses:
        '200':
          description: Network attached; the updated tunnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tunnel'
        '400':
          description: 'BAD_REQUEST: invalid address'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: no such tunnel or network in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: already attached, that address is already taken, the network''s CIDRs overlap an already-attached network''s, or they fall outside the tunnel''s routes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Attach vpc to tunnel
      x-summary-source: derived
    delete:
      tags:
      - Tunnels
      description: 'Detach a private network from a tunnel: it stops being reachable and the tunnel''s address inside it is released. The tunnel — and any connected client — carries on untouched.'
      operationId: detach_vpc_from_tunnel
      parameters:
      - name: tunnelIdOrSlug
        in: path
        description: Tunnel id, or your slug for it
        required: true
        schema:
          type: string
      - name: vpcIdOrSlug
        in: path
        description: VPC id, or your slug for it
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Network detached; the updated tunnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tunnel'
        '404':
          description: 'NOT_FOUND: no such tunnel, or the network is not attached'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Detach vpc from tunnel
      x-summary-source: derived
