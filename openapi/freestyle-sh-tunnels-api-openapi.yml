components:
  schemas:
    PublicErrorBody:
      type: object
      description: 'The shape of every error response: a stable machine-readable `code` and a

        human-readable `message`. The HTTP status carries the class of failure.


        Some errors add fields alongside these two; `code` and `message` are always

        present.'
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'A stable identifier for the failure, in `SCREAMING_SNAKE_CASE`. Branch

            on this; `message` is prose and may be reworded at any time.'
          example: NOT_FOUND
        message:
          type: string
          description: 'A human-readable explanation of what went wrong. A fault inside the

            platform is always reported as `INTERNAL_ERROR` with no further detail.'
          example: vm vm-1234 not found
    CreateTunnelVpc:
      type: object
      description: One network named at create, with the same address choices as an attach.
      required:
      - vpc
      properties:
        exit:
          type: boolean
          description: See the attach request's `exit`.
        ipv4:
          type:
          - string
          - 'null'
          description: The address you want inside it; omit to be assigned one.
        ipv6:
          type:
          - string
          - 'null'
          description: An explicit IPv6 address instead; only one may be set.
        remoteCidrs:
          type: array
          items:
            type: string
          description: 'Ranges behind your client this network may route to; see the attach

            request''s `remoteCidrs`.'
        vpc:
          type: string
          description: 'The network to attach: a VPC id, or your slug for it. Also accepted as

            `vpcId`.'
    ListTunnelsResponse:
      type: object
      required:
      - tunnels
      - totalCount
      properties:
        totalCount:
          type: integer
          minimum: 0
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/Tunnel'
          description: 'Newest first. Listings never carry a private key; the config returned

            here has `PrivateKey` blanked.'
    RotateTunnelKeyRequest:
      type: object
      properties:
        clientPublicKey:
          type:
          - string
          - 'null'
          description: 'The public key of a keypair you already hold. Omit to have a fresh one

            minted for you.'
    UpdateTunnelRequest:
      type: object
      properties:
        displayName:
          type:
          - string
          - 'null'
          description: An empty string clears it.
        slug:
          type:
          - string
          - 'null'
          description: An empty string clears it.
    CreatedTunnel:
      allOf:
      - $ref: '#/components/schemas/Tunnel'
      - type: object
        required:
        - clientPrivateKey
        properties:
          clientPrivateKey:
            type: string
            description: Returned once. Already embedded in `clientConfig`.
      description: 'A tunnel plus a client private key. Returned by the two calls that mint a

        keypair — create and rotate-key — and nowhere else: the key is never stored

        and cannot be read back. Empty when you supplied your own public key.'
    Tunnel:
      type: object
      description: 'A tunnel: your WireGuard identity on the platform. It exists until you

        delete it: connect, disconnect and reconnect as often as you like — a

        session is set up on the handshake that needs it, so an idle tunnel costs

        nothing and never expires. A tunnel routes nowhere until you attach a

        private network to it; attach several and one WireGuard interface reaches

        them all.'
      required:
      - id
      - clientConfig
      - endpointPort
      - clientPublicKey
      - serverPublicKey
      - clientAddressV4
      - clientAddressV6
      - routes
      - attachments
      - createdAt
      - updatedAt
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/TunnelAttachment'
          description: The private networks on the far side, oldest attachment first.
        clientAddressV4:
          type: string
          description: 'Your fixed addresses inside the tunnel. Only the gateway ever sees

            them: each attached network sees an address inside its own subnet

            instead (`attachments[].address`).'
        clientAddressV6:
          type: string
        clientConfig:
          type: string
          description: 'A complete WireGuard config file, fixed for the life of the tunnel:

            attaching and detaching networks never changes it, so bring it up once

            and manage what it reaches through the API. `PrivateKey` is blank

            except on create and rotate-key, the only two responses that mint a

            keypair.'
        clientPublicKey:
          type: string
        createdAt:
          type: string
          format: date-time
        displayName:
          type:
          - string
          - 'null'
          description: Your label for this tunnel, if you gave it one.
        endpointHost:
          type:
          - string
          - 'null'
          description: Host to dial.
        endpointPort:
          type: integer
          format: int32
          minimum: 0
        id:
          type: string
          description: 'Deprecated: the tunnel''s id under its old name. Read `tunnelId`.'
        routes:
          type: array
          items:
            type: string
          description: 'The ranges your client routes through the tunnel — its `AllowedIPs`,

            fixed at create. A network can only be attached if its CIDRs fall

            inside these.'
        serverPublicKey:
          type: string
          description: The one `[Peer]` public key in your config.
        slug:
          type:
          - string
          - 'null'
          description: 'Your handle for this tunnel, if you gave it one. Usable anywhere the id

            is, in place of it.'
        tunnelId:
          type:
          - string
          - 'null'
          description: 'The tunnel''s id, under the name the rest of the API uses for it — a

            firewall rule says `tunnelId`, so the tunnel does too.'
        updatedAt:
          type: string
          format: date-time
    AttachVpcRequest:
      type: object
      properties:
        exit:
          type: boolean
          description: 'Make your client this network''s exit — a router members can name as a

            next hop. A VM routes through it with an ordinary NIC route via the

            attachment''s address, and everything it sends the exit — whatever the

            destination — is forwarded to your client, which is expected to NAT it

            onward. Several attachments per network may be exits: members choose

            per route, so two exits and two same-metric routes are a redundant

            pair, and a dead exit stops being ARP-answered so the other takes

            over by itself.'
        ipv4:
          type:
          - string
          - 'null'
          description: 'The address you want inside the private network. Omit to be assigned

            one. It must be free: a VM already holding it makes this a conflict,

            and once yours, no VM can be given it.'
        ipv6:
          type:
          - string
          - 'null'
          description: 'An explicit IPv6 address, equivalent to passing one in `ipv4`; only one

            may be set.'
        remoteCidrs:
          type: array
          items:
            type: string
          description: 'Ranges behind your client that this network routes through the tunnel —

            a site-to-site setup where your client machine forwards for other hosts

            on its side. Hosts inside these ranges keep their real addresses inside

            the network. A range carved out of the network''s own CIDR just works:

            VMs reach it with no configuration, and the range is excluded from VM

            address allocation (it must be free when granted). A range outside the

            network''s CIDRs is reached by giving VMs a route via the attachment''s

            `address`. A range may not straddle the network''s CIDR boundary, nor

            overlap a range another tunnel already grants this network.'
    TunnelAttachment:
      type: object
      description: 'One private network on the far side of a tunnel: the network, your address

        inside it, and the `[Peer]` key that carries it.'
      required:
      - vpcId
      - address
      - vpcCidr
      - allowedIps
      - createdAt
      properties:
        address:
          type: string
          description: 'Deprecated: the primary address, whichever family. Read `ipv4`/`ipv6`.'
        allowedIps:
          type: array
          items:
            type: string
          description: The CIDRs the gateway routes to this network.
        createdAt:
          type: string
          format: date-time
        exit:
          type: boolean
          description: 'Whether this attachment is a network exit: your client forwards for

            destinations that are not its own address, and members route through

            it with an ordinary route via the attachment''s address. Omitted when

            false.'
        ipv4:
          type:
          - string
          - 'null'
          description: 'Your IPv4 address inside the private network, absent on a v6-only

            attachment. It belongs to this tunnel for as long as the network stays

            attached, so you can write it into configs and rules.'
        ipv6:
          type:
          - string
          - 'null'
          description: Your IPv6 address inside the private network, under the same rules.
        remoteCidrs:
          type: array
          items:
            type: string
          description: 'Ranges behind your client that this network routes through the tunnel

            (a site-to-site grant). VMs reach them with an ordinary route via

            `address`. Omitted when the attachment has none.'
        secondaryAddress:
          type:
          - string
          - 'null'
          description: 'Deprecated: the second-family address. Read `ipv4`/`ipv6`.'
        vpcCidr:
          type: string
        vpcId:
          $ref: '#/components/schemas/VpcId'
    VpcId:
      type: string
      description: Identifies a VPC. Minted as `"vpc-<uuid>"`.
    CreateTunnelRequest:
      type: object
      properties:
        clientPublicKey:
          type:
          - string
          - 'null'
          description: 'The public key of a keypair you already hold. Omit to have one minted

            for you; supply it and the platform never sees a private key at all.'
        displayName:
          type:
          - string
          - 'null'
          description: A free-form label, for telling several tunnels apart.
        routes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'The ranges your client will route through the tunnel — its

            `AllowedIPs`, fixed for the tunnel''s life so attaching and detaching

            networks never changes your config. Omit for the default

            (`10.0.0.0/8` and `fd00::/8`), which covers every network with

            default addressing. Only networks whose CIDRs fall inside the routes

            can be attached.'
        slug:
          type:
          - string
          - 'null'
          description: 'A URL-safe handle, unique within your account: 1–63 chars of

            `[a-z0-9-]`, no leading, trailing, or repeated hyphens. Address the

            tunnel by it instead of by id.'
        vpcs:
          type: array
          items:
            $ref: '#/components/schemas/CreateTunnelVpc'
          description: 'Networks to attach in the same call, so one request yields a tunnel

            that already routes somewhere. All-or-nothing: if any attachment is

            refused, nothing is created.'
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'Your Freestyle API key, sent as `Authorization: Bearer <api key>`. Every request needs one unless it is authenticated with an identity access token instead.'
    identityAccessToken:
      type: apiKey
      in: header
      name: x-freestyle-identity-access-token
      description: An access token belonging to an identity you created. It reaches only the VMs that identity has been granted, and only their exec and terminal routes. Hand one to an end user instead of your API key.
