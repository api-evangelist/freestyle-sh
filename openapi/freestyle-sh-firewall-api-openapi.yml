openapi: 3.2.0
info:
  title: Freestyle Firewall API
  description: '# Powerful Virtual Machines


    Documentation: freestyle.sh/docs


    Freestyle VMs are full Linux virtual machines designed for long running, complex tasks. ## Key Features


    - **Instant Startup**: Freestyle VMs provision in milliseconds, with p99s under 400ms. - **Persistence**: Freestyle VMs can run forever, they can be hibernated with their exact memory in place and come back to life weeks later instantly, in that exact state. - **Powerful**: Freestyle VMs go up to 64GB of RAM for public tiers and much further for enterprise. Freestyle does high quality hardware virtualization supporting nested virtualization, FUSE, eBPF, full Linux networking and more. If it can run in an EC2, it can run in a Freestyle VM. - **Cheaply Snapshottable and Branchable**: Freestyle VMs are instantly and cheaply snapshottable (sub 1ms interruption, sub 50ms to snapshot ready). These snapshots can be used to create new VMs in the exact state of the original VM (memory and disk). This enables powerful workflows like branching, cloning, and rapid recovery from failures. ## When to use Freestyle


    - **Long Running Agent Tasks**: When you have tasks that take hours, days, weeks or months to run, Freestyle VMs provide a persistent and powerful environment that your agent can work in to completion. - **Failure Prone/Experimental Exploration**: When your tasks involve branching, cloning or need time travel Freestyle VMs are ideal because of their cheap snapshottability and power that makes them great for experiments. - **Complex Coding Problems**: When you are tackling advanced coding problems in research or production codebases, poor virtualization and small sandboxes will not cut it. Freestyle VMs provide the necessary resources and environment to handle these challenges effectively. - **Multi Tenant Usage Patterns**: Freestyle VMs are intentionally built to be used by agent builders with multiple customers. The slug system allows for keying VMs by their user, the identity system allows for granular acccess control and permissioning, and the VPC system allows for multi-tenant network isolation. ## When not to use it


    - **"Run AI Code"**: If your exclusively executing short lived Python scripts or other ephemeral tasks the benefits above aren''t relevant. Freestyle VMs should still be benchmarked but there may be alternatives better suited. - **CPU Intensive CI/CD**: Freestyle VMs run on bare metal on data center CPUs. We also oversubscribe host resources. For workloads that require sustained high CPU usage like building the Linux Kernel or mining crypto prefer cloud providers that offer consumer CPU performance. - **Short Lived Tasks**: If your tasks are extremely short lived and do not benefit from persistence or powerful hardware. If your average task takes less than 15 minutes to complete then they are likely cheaply retryable and don''t require the reliability and persistence that Freestyle VMs provide. - **Sole Application Hosting**: Freestyle VMs are designed as workbenches for development, experimentation and task execution. Not for hosting production applications. Hosting a minecraft server for some friends will work great on Freestyle, but we do not offer autoscaling, load balancers or CDNs and we don''t plan to. ## Emerging Use Cases


    - **RL Environments**: Freestyle VMs are well-suited for running reinforcement learning environments that require persistent state and complex setups. The ability to snapshot and branch VMs allows researchers to experiment with different strategies and record environment states efficiently. - **Auto Research Climbing**: Freestyle VMs are great for auto research as the snapshotting and fan out allows research agents to explore multiple strategies, review past results and iterate efficiently without ever losing progress.'
  license:
    name: ''
  version: 0.1.0
security:
- apiKey: []
tags:
- name: Firewall
paths:
  /firewall/evaluate:
    post:
      tags:
      - Firewall
      description: 'Ask whether a connection would be allowed by your rules, without changing anything. Useful for checking a rule set before you rely on it. Traffic Freestyle itself delivers — a mapped domain, the SSH proxy — answers `allowedByPlatform`: it is allowed whatever your rules say, and no rule can block it. Outbound mail answers `deniedByPlatform`: a connection to a mail port on the public Internet is closed whatever your rules say, and goes through an `smtp` TLS rule instead.'
      operationId: evaluate_firewall
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrafficDescription'
        required: true
      responses:
        '200':
          description: The decision, and what produced it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallDecision'
        '400':
          description: 'BAD_REQUEST: the traffic description is not well formed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Evaluate firewall
      x-summary-source: derived
  /firewall/rules:
    get:
      tags:
      - Firewall
      description: List your firewall rules, newest first. Filter by `vmId` to get the rules that apply to one VM — those naming it, plus those naming a private network it is attached to — or by `vpcId`/`tunnelId` for the rules naming one of those.
      operationId: list_firewall_rules
      parameters:
      - name: vmId
        in: query
        description: 'Rules that apply to this VM: those naming it, plus those naming a

          private network it is attached to. Its id, or your slug for it.'
        required: false
        schema:
          type: string
      - name: vpcId
        in: query
        description: Rules naming this private network. Its id, or your slug for it.
        required: false
        schema:
          type: string
      - name: tunnelId
        in: query
        description: Rules naming this tunnel, by its id.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: The account's firewall rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFirewallRulesResponse'
        '404':
          description: 'NOT_FOUND: a `vmId`, `vpcId`, or `tunnelId` filter names something that does not exist in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: List firewall rules
      x-summary-source: derived
    post:
      tags:
      - Firewall
      description: 'Allow traffic from one place to another. Both `source` and `destination` are matchers whose fields intersect; use `public: true` for the public Internet. A rule naming a VM, a private network, or a tunnel is deleted automatically when that resource is.'
      operationId: create_firewall_rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFirewallRuleRequest'
        required: true
      responses:
        '200':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallRule'
        '400':
          description: 'BAD_REQUEST: an unknown field, a matcher that identifies nothing, a port without a protocol, or a malformed CIDR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '404':
          description: 'NOT_FOUND: the rule names a VM, network, or tunnel that does not exist in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '409':
          description: 'CONFLICT: your account is at its firewall rule limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Create firewall rule
      x-summary-source: derived
  /firewall/rules/{ruleId}:
    get:
      tags:
      - Firewall
      description: Fetch one firewall rule.
      operationId: get_firewall_rule
      parameters:
      - name: ruleId
        in: path
        description: Firewall rule id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallRule'
        '404':
          description: 'NOT_FOUND: no such rule in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Get firewall rule
      x-summary-source: derived
    delete:
      tags:
      - Firewall
      description: Delete a firewall rule. The resources it named are untouched — the dependency runs one way.
      operationId: delete_firewall_rule
      parameters:
      - name: ruleId
        in: path
        description: Firewall rule id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Rule deleted
        '404':
          description: 'NOT_FOUND: no such rule in this account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
      deprecated: true
      summary: Delete firewall rule
      x-summary-source: derived
