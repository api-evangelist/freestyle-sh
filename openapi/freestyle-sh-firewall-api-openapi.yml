components:
  schemas:
    PublicErrorBody:
      type: object
      description: 'The shape of every error response: a stable machine-readable `code` and a

        human-readable `message`. The HTTP status carries the class of failure.


        Some errors add fields alongside these two; `code` and `message` are always

        present.'
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'A stable identifier for the failure, in `SCREAMING_SNAKE_CASE`. Branch

            on this; `message` is prose and may be reworded at any time.'
          example: NOT_FOUND
        message:
          type: string
          description: 'A human-readable explanation of what went wrong. A fault inside the

            platform is always reported as `INTERNAL_ERROR` with no further detail.'
          example: vm vm-1234 not found
    ListFirewallRulesResponse:
      type: object
      required:
      - rules
      - totalCount
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/FirewallRule'
          description: Newest first.
        totalCount:
          type: integer
          minimum: 0
    TrafficDescription:
      type: object
      description: A connection to decide about.
      required:
      - source
      - destination
      properties:
        destination:
          $ref: '#/components/schemas/TrafficParty'
        protocol:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FirewallProtocol'
        source:
          $ref: '#/components/schemas/TrafficParty'
      additionalProperties: false
    FirewallRule:
      type: object
      description: 'An allowed path through the network, as intent: traffic matching `source`

        may reach `destination`.'
      required:
      - id
      - action
      - source
      - destination
      - createdAt
      - updatedAt
      properties:
        action:
          $ref: '#/components/schemas/FirewallAction'
        createdAt:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/FirewallDependency'
          description: 'What this rule depends on. Deleting any of them deletes this rule, so

            no rule is ever left pointing at something that no longer exists.'
        description:
          type:
          - string
          - 'null'
        destination:
          $ref: '#/components/schemas/FirewallEndpoint'
        id:
          type: string
        source:
          $ref: '#/components/schemas/FirewallEndpoint'
        updatedAt:
          type: string
          format: date-time
    FirewallDecision:
      type: object
      description: 'Why a connection would be allowed, or that it would not.


        `outcome` is `allowedByPlatform` (Freestyle''s own ingress, e.g. a mapped

        domain — no rule involved), `allowedByRule` (with the `ruleId` that

        matched), `deniedByPlatform` (with the `reason`, e.g. `outboundMail`, that

        no rule can override), or `denied`.'
      required:
      - outcome
      properties:
        outcome:
          type: string
        reason:
          type:
          - string
          - 'null'
          description: Which platform policy closed it, on `deniedByPlatform`.
        ruleId:
          type:
          - string
          - 'null'
          description: The rule that matched, on `allowedByRule`.
        side:
          type:
          - string
          - 'null'
          description: Which end was Freestyle's ingress, on `allowedByPlatform`.
    FirewallEndpoint:
      type: object
      description: 'One end of a rule: which traffic this side matches.


        Fields intersect — `{ vpcId, port, protocol }` is "traffic in that network,

        on that port, over that protocol". `vmId`/`vpcId`/`tunnelId` select by

        identity (the VM however it is addressed); `cidr`/`public` select by

        address. Unknown fields

        are rejected rather than ignored: a matcher is a security statement, and a

        typo''d `porrt: 22` that quietly became "every port" is the wrong failure.'
      properties:
        cidr:
          type:
          - string
          - 'null'
          description: An address range, IPv4 or IPv6, in canonical `network/prefix` form.
        port:
          type:
          - integer
          - 'null'
          format: int32
          description: A single port, 1–65535. Requires `protocol`.
          minimum: 0
        protocol:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FirewallProtocol'
        public:
          type:
          - boolean
          - 'null'
          description: 'Every publicly routable address, whoever owns it — including another

            Freestyle VM reached at its public address. Only `true` is meaningful;

            omit the field otherwise. Not combined with `vmId` or `vpcId`.'
        tunnelId:
          type:
          - string
          - 'null'
          description: 'Whatever is on the far side of one tunnel — the client that dials it,

            and any remote range routed over it. Tunnels have no slug, so this is a

            tunnel id: `tun-…`, or `wg-…` for one carried over from the per-VPC VPN

            records tunnels replaced.'
        vmId:
          type:
          - string
          - 'null'
          description: A single VM, by id or by your slug for it. Answers hold its id.
        vpcId:
          type:
          - string
          - 'null'
          description: 'Everything on one private network, by id or by your slug for it.

            Answers hold its id.'
      additionalProperties: false
    FirewallAction:
      type: string
      description: 'What a rule does with the traffic it matches.


        Only `allow` exists today, and it is required on every rule rather than

        defaulted: a default would mean that the day `deny` arrives, every rule

        written before it silently acquires an action it never stated.'
      enum:
      - allow
    CreateFirewallRuleRequest:
      type: object
      required:
      - action
      - source
      - destination
      properties:
        action:
          $ref: '#/components/schemas/FirewallAction'
          description: Required, and `allow` is the only accepted value.
        description:
          type:
          - string
          - 'null'
          description: A free-form note, up to 1024 characters.
        destination:
          $ref: '#/components/schemas/FirewallEndpoint'
        source:
          $ref: '#/components/schemas/FirewallEndpoint'
      additionalProperties: false
    TrafficParty:
      type: object
      description: 'One end of a connection to ask about: everything true about the party, not

        a pattern.'
      properties:
        address:
          type:
          - string
          - 'null'
          description: The address in use, when there is one — what `cidr` rules are tested against.
        platform:
          type: boolean
          description: 'Freestyle''s own ingress — the web proxy serving a mapped domain, or the

            SSH proxy. Always allowed, whatever the rules say.'
        port:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        public:
          type: boolean
          description: 'Whether that address is publicly routable — what `public: true` matches.'
        tunnelId:
          type:
          - string
          - 'null'
        vmId:
          type:
          - string
          - 'null'
        vpcIds:
          type: array
          items:
            type: string
          description: Every private network this party is on; a rule naming one of them matches.
      additionalProperties: false
    FirewallProtocol:
      type: string
      description: The transport a matcher is restricted to.
      enum:
      - tcp
      - udp
      - icmp
    FirewallDependency:
      type: object
      description: 'A resource a rule cannot outlive: deleting it deletes the rule.'
      required:
      - kind
      - id
      properties:
        displayName:
          type:
          - string
          - 'null'
          description: Your label for the named resource, under the same rules as `slug`.
        id:
          type: string
          description: The resource's id.
        kind:
          type: string
          description: '`vm`, `vpc`, or `tunnel` today. New selectors add new kinds.'
        slug:
          type:
          - string
          - 'null'
          description: 'Your handle for the named resource, when it has one — so a rule says

            what it points at without a lookup per id.'
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'Your Freestyle API key, sent as `Authorization: Bearer <api key>`. Every request needs one unless it is authenticated with an identity access token instead.'
    identityAccessToken:
      type: apiKey
      in: header
      name: x-freestyle-identity-access-token
      description: An access token belonging to an identity you created. It reaches only the VMs that identity has been granted, and only their exec and terminal routes. Hand one to an end user instead of your API key.
